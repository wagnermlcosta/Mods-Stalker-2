//-------------ASSAULT RIFLES---------------
//------------------------------------------

// Duty's Pride
GunDniproDuty_ST : struct.begin {bpatch}
   FireInterval = 0.067
   RecoilParams : struct.begin {bpatch}
      RecoilRadius = 110
      RecoilMaxPitch = 10.8
      RecoilPatternInterval = 0.067
   struct.end
struct.end

// Warszawa – 5.56 + 900 RPM
GunWarszawa_AR_GS : struct.begin {bpatch}
   FireInterval = 0.067
   AmmoCaliber = EAmmoCaliber::A556
   AmmoTypeProjectiles : struct.begin {bpatch}
      [0] : struct.begin {bpatch}
         AmmoType = EAmmoType::Default
         ProjectilePrototypeSID = P556
      struct.end
      [1] : struct.begin {bpatch}
         AmmoType = EAmmoType::ArmorPiercing
         ProjectilePrototypeSID = P556
      struct.end
      [2] : struct.begin {bpatch}
         AmmoType = EAmmoType::Supersonic
         ProjectilePrototypeSID = P556
      struct.end
   struct.end
   RecoilParams : struct.begin {bpatch}
      RecoilRadius = 95
      RecoilMaxPitch = 10
      RecoilPatternInterval = 0.067
   struct.end
struct.end

// Leichtfuchs – 900 RPM + Single / Burst / Full Auto
GunArevLight_AR_GS : struct.begin {bpatch}
   FireInterval = 0.067
   FireTypes : struct.begin {bpatch}
      [0] = EFireType::SemiAutomatic
      [1] = EFireType::Queue
      [2] = EFireType::Automatic
   struct.end
   DefaultFireType = EFireType::Automatic
   FireQueueCount = 3
   RecoilParams : struct.begin {bpatch}
      RecoilRadius = 88
      RecoilMaxPitch = 10
      RecoilPatternInterval = 0.067
   struct.end
struct.end

